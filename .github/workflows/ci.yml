name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    name: pytest (python-${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricing
          POSTGRES_PASSWORD: pricing
          POSTGRES_DB: pricing_test
        ports: ["5432:5432"]
        # pg_isready par défaut tente le user "root" du runner et
        # pollue les logs avec FATAL: role "root" does not exist.
        # On lui passe explicitement le user applicatif.
        options: >-
          --health-cmd "pg_isready -U pricing -d pricing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: "postgresql+psycopg://pricing:pricing@localhost/pricing_test"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier les migrations Alembic au seed
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql+psycopg://pricing:pricing@localhost/pricing_test"

      - name: Lancer la suite de tests
        run: pytest -q -rs --maxfail=5

  docker-build:
    runs-on: ubuntu-latest
    name: docker build + smoke test
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pricinghub-api:ci .

      - name: Smoke test healthz
        run: |
          docker run -d --name api -p 8000:8000 \
            -e CATALOG_DATABASE_URL="" \
            -e REDIS_URL="" \
            pricinghub-api:ci
          # Attend que gunicorn démarre
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo ""
              echo "Healthz OK au bout de $i secondes"
              exit 0
            fi
            sleep 1
          done
          echo "Healthz n'a pas répondu dans les 30s"
          docker logs api
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f api || true
