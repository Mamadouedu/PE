[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akiem-pricing-engine"
version = "0.1.0"
description = "Moteur de prix et référentiel pricing — Plateforme Pricing Akiem (Lot 1, Socle)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "httpx>=0.27",
    "reportlab>=4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23",
    "alembic>=1.13",
    "redis>=5",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5", "fakeredis>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
