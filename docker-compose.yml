# docker-compose pour développement et démonstration locale.
#
# Stack complète en 3 services :
# - api         : l'API PricingHub (build local)
# - postgres    : Postgres 16, data persistée en volume nommé
# - redis       : Redis 7, pas de persistance (sessions éphémères)
#
# Usage :
#   docker compose up --build        # premier lancement
#   docker compose up                # relance
#   docker compose down              # stop, garde les volumes
#   docker compose down -v           # stop + supprime les données
#
# L'API écoute sur http://localhost:8000. Swagger UI : /docs
# Les migrations s'appliquent au démarrage (service api-migrate).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pricing", "-d", "pricing_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  # Un service éphémère qui applique les migrations et sort. L'API
  # dépend de son succès avant de démarrer : on évite la race entre
  # alembic upgrade head et les premiers inserts du seed.
  api-migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pricing:pricing@postgres/pricing_dev
    command: alembic upgrade head
    restart: "no"

  api:
    build: .
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pricing:pricing@postgres/pricing_dev
      CATALOG_DATABASE_URL: postgresql+psycopg://pricing:pricing@postgres/pricing_dev
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      GUNICORN_WORKERS: "2"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_data:
